services:
  app:
    build: .
    command: >
      sh -c "uv run --no-sync alembic upgrade head &&
      uv run --no-sync fastapi run app/main.py --host 0.0.0.0 --port 8000"
    environment:
      TASKHUB_DATABASE_URL: "postgresql+asyncpg://taskhub:${TASKHUB_POSTGRES_PASSWORD:?Set TASKHUB_POSTGRES_PASSWORD in .env}@db:5432/taskhub"
      TASKHUB_REDIS_URL: redis://redis:6379/0
      TASKHUB_JWT_SECRET_KEY: ${TASKHUB_JWT_SECRET_KEY:?Set a 32-character-or-longer secret in .env}
      TASKHUB_CORS_ORIGINS: ${TASKHUB_CORS_ORIGINS:-["http://localhost:3000"]}
      TASKHUB_LOG_LEVEL: ${TASKHUB_LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskhub
      POSTGRES_PASSWORD: ${TASKHUB_POSTGRES_PASSWORD:?Set TASKHUB_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: taskhub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhub -d taskhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - taskhub_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskhub_postgres_data:
